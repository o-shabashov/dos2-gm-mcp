name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the MCPB bundle
        run: |
          npx -y @anthropic-ai/mcpb validate manifest.json
          npx -y @anthropic-ai/mcpb pack . dos2-gm-mcp.mcpb
          sha256sum dos2-gm-mcp.mcpb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dos2-gm-mcp.mcpb --title "$GITHUB_REF_NAME" --generate-notes
